name: Premier Manager '97 CI

on:
  pull_request:
    paths: [premier-manager-97/**, .github/workflows/ci-premier-manager-97.yml]
  push:
    branches: [main]
    paths: [premier-manager-97/**, .github/workflows/ci-premier-manager-97.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: premier-manager-97
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm run build
