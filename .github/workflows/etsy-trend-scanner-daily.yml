name: Etsy Trend Scanner — daily report

on:
  schedule:
    # 06:00 UTC daily. The report is ready before the working day starts.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Snapshots are the tool's own history: each run commits one small JSON file,
# and week-over-week momentum is only computable because yesterday's file is
# already in the repo.
permissions:
  contents: write
  # The day's plan is posted as an issue, which is what actually puts it in
  # front of someone: GitHub notifies by email and on the mobile app, and
  # renders the markdown. GitHub Pages is not available here — the retro
  # manager already occupies it as this repository's site.
  issues: write

concurrency:
  group: etsy-trend-scanner-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etsy-trend-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # Without the secret this still runs, on search demand and the seasonal
      # calendar alone, and the report says so at the top.
      - name: Scan and build the report
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_TRENDS_GEO: ${{ vars.ETSY_TRENDS_GEO || 'US' }}
        run: npm run daily -- --quiet

      # Runs before the commit so the day's tidying lands in the same commit as
      # the day's data, rather than as a second churn of the repository.
      - name: Prune old snapshots and stale report pages
        run: npm run prune

      - name: Commit today's snapshot and report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if git diff --staged --quiet; then
            echo "Nothing changed today."
            exit 0
          fi
          git commit -m "Etsy trend report for $(date -u +%F)"
          # Another run may have landed while this one was collecting.
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** attempt))
          done
          exit 1

      # One open issue at a time: today's plan is opened and yesterday's closed,
      # so the notification arrives daily while the issue list stays at one
      # item. Closed issues are the readable archive.
      - name: Post today's plan as an issue
        if: vars.ETSY_TRENDS_ISSUE != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          LABEL=etsy-plan

          # gh refuses to attach a label that does not exist yet.
          gh label create "$LABEL" \
            --description "Daily Etsy listing plan" \
            --color 0E8A6C \
            --force

          # An issue body is capped at 65536 characters; the report is far
          # smaller, but truncate rather than fail the run if that ever changes.
          head -c 60000 reports/latest.md > /tmp/plan.md

          NEW_URL=$(gh issue create \
            --title "Etsy listing plan — $DATE" \
            --body-file /tmp/plan.md \
            --label "$LABEL")
          NEW_NUM="${NEW_URL##*/}"
          echo "Opened $NEW_URL"

          # Close every older open plan, leaving exactly one.
          gh issue list --label "$LABEL" --state open --json number \
            --jq '.[].number' | while read -r n; do
              [ "$n" = "$NEW_NUM" ] && continue
              gh issue close "$n" --comment "Superseded by the plan for $DATE."
            done

      # An unattended daily job that fails silently is worse than no job: the
      # reports simply stop and nothing says why. One issue is reused and
      # reopened rather than a new one per failure, so a week-long outage is a
      # single conversation instead of seven notifications.
      - name: Report a failed run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Etsy trend scanner: daily run is failing"
          BODY="The scheduled run failed on $(date -u +%F).

          Most likely causes, in rough order:

          - Google Trends rate-limiting (HTTP 429) — usually clears on its own
          - an upstream response shape changed, breaking a parser
          - \`ETSY_API_KEY\` missing or rejected

          Run log: $RUN_URL

          \`npm run doctor\` locally will say which source is at fault."

          EXISTING=$(gh issue list --search "$TITLE in:title" --state all \
            --json number,state --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue reopen "$EXISTING" 2>/dev/null || true
            gh issue comment "$EXISTING" --body "Failed again on $(date -u +%F). Run log: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Publish the report as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: etsy-listing-plan
          path: etsy-trend-scanner/reports/latest.*
          if-no-files-found: warn
