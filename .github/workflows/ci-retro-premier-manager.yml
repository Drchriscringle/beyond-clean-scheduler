name: Retro Premier Manager CI

on:
  pull_request:
    paths: [retro-premier-manager/**, .github/workflows/ci-retro-premier-manager.yml]
  push:
    branches: [main]
    paths: [retro-premier-manager/**, .github/workflows/ci-retro-premier-manager.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retro-premier-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm run build
