name: Deploy Premier Manager '97

on:
  push:
    branches: [main]
    paths: [premier-manager-97/**, .github/workflows/deploy-premier-manager-97.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: premier-manager-97
      - run: npm run build -- --base=${{ steps.pages.outputs.base_path }}
        working-directory: premier-manager-97
      - uses: actions/upload-pages-artifact@v3
        with:
          path: premier-manager-97/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
