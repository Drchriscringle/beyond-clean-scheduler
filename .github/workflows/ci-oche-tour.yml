name: Oche Tour CI

on:
  pull_request:
    paths: [oche-tour/**, .github/workflows/ci-oche-tour.yml]
  push:
    branches: [main]
    paths: [oche-tour/**, .github/workflows/ci-oche-tour.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oche-tour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
