name: PrintedPlan Dashboard CI

on:
  pull_request:
    paths: [printedplan-dashboard/**, .github/workflows/ci-printedplan-dashboard.yml]
  push:
    branches: [main]
    paths: [printedplan-dashboard/**, .github/workflows/ci-printedplan-dashboard.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: printedplan-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: printedplan-dashboard/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
