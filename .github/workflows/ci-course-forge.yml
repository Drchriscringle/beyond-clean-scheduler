name: CourseForge CI

on:
  pull_request:
    paths: [course-forge/**, .github/workflows/ci-course-forge.yml]
  push:
    branches: [main]
    paths: [course-forge/**, .github/workflows/ci-course-forge.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
