name: Beyond Clean CI

on:
  pull_request:
    paths: [beyond-clean/**, .github/workflows/ci-beyond-clean.yml]
  push:
    branches: [main]
    paths: [beyond-clean/**, .github/workflows/ci-beyond-clean.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beyond-clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beyond-clean/package-lock.json
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
