name: Professional Darts Tour CI

on:
  pull_request:
    paths: [professional-darts-tour/**, .github/workflows/ci-professional-darts-tour.yml]
  push:
    branches: [main]
    paths: [professional-darts-tour/**, .github/workflows/ci-professional-darts-tour.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: professional-darts-tour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
