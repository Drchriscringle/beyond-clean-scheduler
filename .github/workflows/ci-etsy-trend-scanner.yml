name: Etsy Trend Scanner CI

on:
  pull_request:
    paths: [etsy-trend-scanner/**, .github/workflows/ci-etsy-trend-scanner.yml]
  push:
    branches: [main]
    paths: [etsy-trend-scanner/**, .github/workflows/ci-etsy-trend-scanner.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etsy-trend-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm test
