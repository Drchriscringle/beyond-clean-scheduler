name: Life Dashboard CI

on:
  pull_request:
    paths: [life-dashboard/**, .github/workflows/ci-life-dashboard.yml]
  push:
    branches: [main]
    paths: [life-dashboard/**, .github/workflows/ci-life-dashboard.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx oxlint
      - run: npm test
      - run: npm run build
